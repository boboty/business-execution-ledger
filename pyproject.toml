[project]
name = "bel"
version = "0.1.0"
description = "Business Execution Ledger — business fact and execution system"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "click>=8.1",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
bel = "bel.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
