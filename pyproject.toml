[project]
name = "bel"
version = "0.2.0"
description = "Business Execution Ledger — business fact and execution system"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "click>=8.1",
    "pdfplumber>=0.11",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
bel = "bel.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: requires a real PostgreSQL database via BEL_DATABASE_URL (skipped automatically when not configured — see tests/postgres/conftest.py)",
]
filterwarnings = [
    # starlette recommends httpx2, but Phase 2C deliberately tests with httpx
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
