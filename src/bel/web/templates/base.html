<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BEL{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/period-close">BEL</a>
      <nav class="mainnav">
        <a class="navlink {% if page == 'period-close' %}active{% endif %}" href="/period-close">月结决策工作台</a>
        <a class="navlink {% if page == 'contract-360' %}active{% endif %}" href="/contracts/search?no=">合同360°</a>
        <a class="navlink {% if page == 'contract-ledger' %}active{% endif %}" href="/contract-ledger">合同业务总账</a>
        <a class="navlink {% if page == 'invoice-preparation' %}active{% endif %}" href="/invoice-preparation">开票准备事实</a>
      </nav>
      <form class="searchbox" method="get" action="/contracts/search">
        <label class="sr-only" for="contract-search">合同搜索</label>
        <input id="contract-search" type="text" name="no" placeholder="合同搜索" value="{{ search_query|default('') }}">
        <button type="submit">搜索</button>
      </form>
    </div>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
